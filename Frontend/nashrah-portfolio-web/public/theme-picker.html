<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio Theme Palette Picker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: #0d0d0f;
      color: #f0f0f4;
      min-height: 100vh;
      padding: 2rem 1rem 4rem;
    }

    /* ── Header ── */
    .header {
      text-align: center;
      margin-bottom: 3rem;
    }
    .header h1 {
      font-family: 'Fraunces', serif;
      font-size: clamp(2rem, 5vw, 3rem);
      font-weight: 600;
      background: linear-gradient(135deg, #c084fc, #fb7185, #f59e0b);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 0.5rem;
    }
    .header p {
      color: #888;
      font-size: 0.95rem;
      letter-spacing: 0.02em;
    }

    /* ── Mode Toggle ── */
    .mode-toggle-row {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      margin-bottom: 2.5rem;
    }
    .mode-btn {
      padding: 0.45rem 1.2rem;
      border-radius: 999px;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: transparent;
      color: #aaa;
      font-size: 0.82rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }
    .mode-btn.active {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.35);
      color: #fff;
    }

    /* ── Grid ── */
    .palettes-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(340px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    /* ── Palette Card ── */
    .palette-card {
      border-radius: 20px;
      border: 2px solid rgba(255,255,255,0.06);
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.25s cubic-bezier(.34,1.56,.64,1), border-color 0.25s, box-shadow 0.25s;
      background: #18181c;
      position: relative;
    }
    .palette-card:hover {
      transform: translateY(-4px);
      border-color: rgba(255,255,255,0.18);
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }
    .palette-card.selected {
      border-color: rgba(255,255,255,0.55);
      box-shadow: 0 0 0 4px rgba(255,255,255,0.08), 0 20px 60px rgba(0,0,0,0.6);
    }
    .palette-card.selected::after {
      content: '✓  Selected';
      position: absolute;
      top: 14px;
      right: 14px;
      background: rgba(255,255,255,0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: #fff;
      padding: 0.3rem 0.8rem;
      z-index: 10;
    }

    /* ── UI Mockup Preview ── */
    .mockup {
      padding: 1.5rem;
      border-radius: 14px;
      margin: 0.75rem;
      font-size: 0.78rem;
      position: relative;
      overflow: hidden;
      min-height: 200px;
    }
    .mockup-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 1.2rem;
    }
    .mockup-logo {
      font-family: 'Fraunces', serif;
      font-size: 1rem;
      font-weight: 600;
    }
    .mockup-nav-links {
      display: flex;
      gap: 0.8rem;
      font-size: 0.7rem;
      opacity: 0.6;
    }
    .mockup-hero {
      margin-bottom: 1rem;
    }
    .mockup-hero h2 {
      font-family: 'Fraunces', serif;
      font-size: 1.3rem;
      font-weight: 600;
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }
    .mockup-hero p {
      font-size: 0.7rem;
      opacity: 0.6;
      line-height: 1.6;
      max-width: 280px;
    }
    .mockup-btns {
      display: flex;
      gap: 0.5rem;
      margin: 0.8rem 0;
    }
    .mockup-btn-primary {
      padding: 0.4rem 1rem;
      border-radius: 8px;
      border: none;
      font-size: 0.7rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: default;
    }
    .mockup-btn-outline {
      padding: 0.4rem 1rem;
      border-radius: 8px;
      border: 1.5px solid;
      font-size: 0.7rem;
      font-weight: 600;
      background: transparent;
      font-family: 'Inter', sans-serif;
      cursor: default;
    }
    .mockup-pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      margin-top: 0.6rem;
    }
    .mockup-pill {
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-size: 0.63rem;
      font-weight: 500;
      font-family: 'JetBrains Mono', monospace;
    }
    .mockup-card-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.9rem;
    }
    .mockup-mini-card {
      flex: 1;
      border-radius: 10px;
      padding: 0.6rem 0.7rem;
      font-size: 0.65rem;
    }
    .mockup-mini-card .label { opacity: 0.5; font-size: 0.6rem; margin-bottom: 0.2rem; }
    .mockup-mini-card .val { font-weight: 600; font-size: 0.8rem; }

    /* ── Swatches Section ── */
    .swatches-section {
      padding: 1rem 1rem 0.5rem;
    }
    .swatches-label {
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: #666;
      text-transform: uppercase;
      margin-bottom: 0.7rem;
      font-weight: 500;
    }
    .swatches-row {
      display: flex;
      gap: 0.4rem;
      margin-bottom: 0.6rem;
      align-items: center;
    }
    .swatch {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      position: relative;
      flex-shrink: 0;
      transition: transform 0.15s;
      box-shadow: 0 2px 8px rgba(0,0,0,0.35);
    }
    .swatch:hover { transform: scale(1.15); }
    .swatch-group {
      flex: 1;
    }
    .swatch-name {
      font-size: 0.62rem;
      color: #555;
      margin-left: 0.15rem;
    }
    .swatch-hex {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.62rem;
      color: #666;
    }

    /* ── Card Footer ── */
    .card-footer {
      padding: 0.7rem 1rem 1rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .card-title {
      font-weight: 600;
      font-size: 0.9rem;
      color: #eee;
    }
    .card-tag {
      font-size: 0.65rem;
      color: #666;
      font-weight: 400;
    }
    .select-btn {
      padding: 0.4rem 1rem;
      border-radius: 8px;
      border: 1.5px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.05);
      color: #ccc;
      font-size: 0.75rem;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: all 0.2s;
      font-weight: 500;
    }
    .select-btn:hover {
      background: rgba(255,255,255,0.12);
      border-color: rgba(255,255,255,0.3);
      color: #fff;
    }
    .palette-card.selected .select-btn {
      background: rgba(255,255,255,0.15);
      border-color: rgba(255,255,255,0.4);
      color: #fff;
    }

    /* ── Divider ── */
    .swatches-divider { border: none; border-top: 1px solid rgba(255,255,255,0.06); margin: 0.5rem 0; }

    /* ── Typography Row ── */
    .type-row {
      display: flex;
      gap: 0.6rem;
      padding: 0 1rem 0.8rem;
    }
    .type-chip {
      font-size: 0.65rem;
      padding: 0.2rem 0.55rem;
      border-radius: 6px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.08);
      color: #888;
    }

    /* ── Bottom Banner ── */
    .apply-banner {
      text-align: center;
      margin-top: 3rem;
      padding: 1.5rem;
      border-radius: 16px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.08);
      max-width: 500px;
      margin-inline: auto;
    }
    .apply-banner p { color: #777; font-size: 0.85rem; margin-bottom: 1rem; }
    #apply-text { color: #ccc; font-weight: 600; }
    .apply-main-btn {
      padding: 0.65rem 2rem;
      border-radius: 10px;
      border: none;
      font-size: 0.9rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      background: linear-gradient(135deg, #c084fc, #fb7185);
      color: #fff;
      transition: opacity 0.2s, transform 0.2s;
    }
    .apply-main-btn:hover { opacity: 0.85; transform: scale(1.03); }
    .apply-main-btn:disabled { opacity: 0.35; transform: none; cursor: not-allowed; }
  </style>
</head>
<body>

<div class="header">
  <h1>Portfolio Theme Palettes</h1>
  <p>Click any theme to preview & select — live CSS rendered, no images</p>
</div>

<div class="mode-toggle-row">
  <button class="mode-btn active" onclick="setMode('dark')" id="btn-dark">● Dark Mode</button>
  <button class="mode-btn" onclick="setMode('light')" id="btn-light">○ Light Mode</button>
</div>

<div class="palettes-grid" id="grid"></div>

<div class="apply-banner">
  <p>Ready to apply? <span id="apply-text">No theme selected yet.</span></p>
  <button class="apply-main-btn" id="apply-btn" disabled onclick="applyTheme()">Apply to Portfolio →</button>
</div>

<script>
const THEMES = [
  {
    id: 'plum',
    name: 'Plum & Rose Gold',
    tag: 'Warm Editorial Luxury',
    badge: 'Current Theme',
    dark: {
      bg: '#100B18', surface: '#1C1526', card: '#251A32',
      primary: '#8B3A5C', secondary: '#B98BD9', accent: '#C08B6F',
      text: '#F5F1F7', muted: '#B3A8C2',
    },
    light: {
      bg: '#FBF8FF', surface: '#FFFFFF', card: '#F4EEFB',
      primary: '#8A6BC4', secondary: '#C97B96', accent: '#C08B6F',
      text: '#241A2E', muted: '#756B87',
    },
    gradient: 'linear-gradient(135deg, #8B3A5C, #B98BD9)',
    gradientLight: 'linear-gradient(135deg, #8A6BC4, #C97B96)',
  },
  {
    id: 'sapphire',
    name: 'Cyber Sapphire & Violet',
    tag: 'Modern Tech & AI',
    dark: {
      bg: '#0B0F19', surface: '#151C2C', card: '#1E293B',
      primary: '#6366F1', secondary: '#A855F7', accent: '#22D3EE',
      text: '#F8FAFC', muted: '#94A3B8',
    },
    light: {
      bg: '#F4F7FB', surface: '#FFFFFF', card: '#EBF1FA',
      primary: '#2563EB', secondary: '#7C3AED', accent: '#06B6D4',
      text: '#0F172A', muted: '#64748B',
    },
    gradient: 'linear-gradient(135deg, #6366F1, #A855F7)',
    gradientLight: 'linear-gradient(135deg, #2563EB, #7C3AED)',
  },
  {
    id: 'emerald',
    name: 'Emerald Aurora & Gold',
    tag: 'Organic Luxury & Calm',
    dark: {
      bg: '#0A1410', surface: '#13221C', card: '#1B2E26',
      primary: '#10B981', secondary: '#6EE7B7', accent: '#F59E0B',
      text: '#F0F7F3', muted: '#9BB3A4',
    },
    light: {
      bg: '#F5F7F4', surface: '#FFFFFF', card: '#E8EFE9',
      primary: '#15803D', secondary: '#34D399', accent: '#D97706',
      text: '#111A15', muted: '#57695D',
    },
    gradient: 'linear-gradient(135deg, #10B981, #F59E0B)',
    gradientLight: 'linear-gradient(135deg, #15803D, #D97706)',
  },
  {
    id: 'obsidian',
    name: 'Obsidian & Sunset Coral',
    tag: 'Bold Minimalist',
    dark: {
      bg: '#09090B', surface: '#18181B', card: '#27272A',
      primary: '#FF6B6B', secondary: '#FF9E7D', accent: '#FFC107',
      text: '#FAFAFA', muted: '#A1A1AA',
    },
    light: {
      bg: '#FAFAFA', surface: '#FFFFFF', card: '#F1F5F9',
      primary: '#1E293B', secondary: '#F97316', accent: '#F59E0B',
      text: '#020617', muted: '#64748B',
    },
    gradient: 'linear-gradient(135deg, #FF6B6B, #FFC107)',
    gradientLight: 'linear-gradient(135deg, #1E293B, #F97316)',
  }
];

let currentMode = 'dark';
let selectedId = null;

function setMode(mode) {
  currentMode = mode;
  document.getElementById('btn-dark').classList.toggle('active', mode === 'dark');
  document.getElementById('btn-light').classList.toggle('active', mode === 'light');
  renderGrid();
}

function selectTheme(id) {
  selectedId = id;
  renderGrid();
  const t = THEMES.find(t => t.id === id);
  document.getElementById('apply-text').textContent = `"${t.name}" selected.`;
  document.getElementById('apply-btn').disabled = false;
}

function applyTheme() {
  if (!selectedId) return;
  const t = THEMES.find(t => t.id === selectedId);
  const msg = `You chose: ${t.name}. Copy the CSS variables from the color card and paste into globals.css!`;
  alert(msg);
}

function hex(c) { return `<span style="font-family:'JetBrains Mono',monospace;font-size:0.62rem;color:#666">${c}</span>`; }

function renderGrid() {
  const grid = document.getElementById('grid');
  grid.innerHTML = THEMES.map(t => {
    const c = currentMode === 'dark' ? t.dark : t.light;
    const grad = currentMode === 'dark' ? t.gradient : t.gradientLight;
    const isSelected = selectedId === t.id;
    const isDarkMode = currentMode === 'dark';

    const textColor = c.text;
    const mutedColor = c.muted;

    const swatchItems = [
      { label: 'Background', hex: c.bg },
      { label: 'Surface', hex: c.surface },
      { label: 'Card', hex: c.card },
      { label: 'Primary', hex: c.primary },
      { label: 'Secondary', hex: c.secondary },
      { label: 'Accent', hex: c.accent },
      { label: 'Text', hex: c.text },
      { label: 'Muted', hex: c.muted },
    ];

    const swatchsHtml = swatchItems.map(s =>
      `<div title="${s.label}: ${s.hex}" class="swatch" style="background:${s.hex}; outline: 1px solid rgba(${isDarkMode?'255,255,255':'0,0,0'},0.12); outline-offset:-1px"></div>`
    ).join('');

    const pillColors = [c.primary, c.secondary, c.accent];
    const pillLabels = ['React', 'Next.js', 'TypeScript', 'Node'];

    return `
    <div class="palette-card ${isSelected ? 'selected' : ''}" onclick="selectTheme('${t.id}')">

      <!-- UI Mockup -->
      <div class="mockup" style="background:${c.bg}; color:${c.text}">
        <!-- Decorative blob -->
        <div style="position:absolute;top:-40px;right:-40px;width:130px;height:130px;border-radius:50%;background:${c.primary};opacity:0.12;filter:blur(30px);pointer-events:none"></div>
        <div style="position:absolute;bottom:-30px;left:-30px;width:100px;height:100px;border-radius:50%;background:${c.secondary};opacity:0.10;filter:blur(25px);pointer-events:none"></div>

        <div class="mockup-nav">
          <div class="mockup-logo" style="background:${grad};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">
            Nashrah.
          </div>
          <div class="mockup-nav-links" style="color:${c.muted}">
            <span>Work</span><span>About</span><span>Contact</span>
          </div>
        </div>

        <div class="mockup-hero">
          <h2 style="color:${c.text}">Full-Stack<br/><span style="background:${grad};-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text">Developer</span></h2>
          <p style="color:${c.muted}">Crafting beautiful, high-performance digital experiences with modern tech.</p>
        </div>

        <div class="mockup-btns">
          <button class="mockup-btn-primary" style="background:${c.primary};color:#fff">View Work</button>
          <button class="mockup-btn-outline" style="border-color:${c.primary};color:${c.primary}">Contact Me</button>
        </div>

        <div class="mockup-pills">
          ${pillLabels.map((l, i) => `<span class="mockup-pill" style="background:${pillColors[i % 3]}22;color:${pillColors[i % 3]};border:1px solid ${pillColors[i % 3]}44">${l}</span>`).join('')}
          <span class="mockup-pill" style="background:${c.card};color:${c.muted};border:1px solid ${c.muted}33">+12 more</span>
        </div>

        <div class="mockup-card-row">
          <div class="mockup-mini-card" style="background:${c.card};border:1px solid ${c.primary}22">
            <div class="label" style="color:${c.muted}">Projects</div>
            <div class="val" style="color:${c.primary}">24+</div>
          </div>
          <div class="mockup-mini-card" style="background:${c.card};border:1px solid ${c.secondary}22">
            <div class="label" style="color:${c.muted}">GitHub Stars</div>
            <div class="val" style="color:${c.secondary}">1.2k</div>
          </div>
          <div class="mockup-mini-card" style="background:${c.card};border:1px solid ${c.accent}22">
            <div class="label" style="color:${c.muted}">Experience</div>
            <div class="val" style="color:${c.accent}">3 yrs</div>
          </div>
        </div>
      </div>

      <!-- Swatches -->
      <div class="swatches-section">
        <div class="swatches-label">Color Tokens</div>
        <div class="swatches-row" style="gap:0.35rem;flex-wrap:wrap">
          ${swatchsHtml}
        </div>

        <!-- Labels below swatches -->
        <div style="display:flex;gap:0.35rem;flex-wrap:wrap;margin-top:0.35rem;">
          ${swatchItems.map(s => `
            <div style="width:36px;text-align:center;flex-shrink:0">
              <div style="font-size:0.52rem;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${s.label}</div>
            </div>
          `).join('')}
        </div>

        <hr class="swatches-divider" style="margin-top:0.8rem" />

        <!-- Gradient strip -->
        <div style="margin: 0.5rem 0 0.8rem;height:6px;border-radius:999px;background:${grad};opacity:0.8"></div>

        <!-- CSS Snippet -->
        <div style="background:rgba(0,0,0,0.3);border:1px solid rgba(255,255,255,0.07);border-radius:8px;padding:0.6rem 0.8rem;font-family:'JetBrains Mono',monospace;font-size:0.6rem;color:#777;line-height:1.8;overflow:hidden;max-height:80px">
          <span style="color:#888">--primary:</span> <span style="color:${c.primary}">${c.primary}</span>;<br/>
          <span style="color:#888">--secondary:</span> <span style="color:${c.secondary}">${c.secondary}</span>;<br/>
          <span style="color:#888">--accent:</span> <span style="color:${c.accent}">${c.accent}</span>;
        </div>
      </div>

      <div class="type-row">
        <span class="type-chip">Fraunces Serif</span>
        <span class="type-chip">Inter Sans</span>
        <span class="type-chip">Mono: JetBrains</span>
      </div>

      <div class="card-footer">
        <div>
          <div class="card-title">${t.name} ${t.badge ? `<span style="font-size:0.6rem;color:#666;font-weight:400">(${t.badge})</span>` : ''}</div>
          <div class="card-tag">${t.tag}</div>
        </div>
        <button class="select-btn" onclick="event.stopPropagation();selectTheme('${t.id}')">
          ${isSelected ? '✓ Selected' : 'Select →'}
        </button>
      </div>
    </div>
    `;
  }).join('');
}

renderGrid();
</script>
</body>
</html>
